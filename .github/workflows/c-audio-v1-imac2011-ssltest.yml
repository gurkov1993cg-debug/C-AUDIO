      - name: Verify frozen SSL DSP
        shell: bash
        run: |
          echo "959983550a7122f444152b401113d08d83422a70160256aa297a6c4615245e6d  src/engine/SSLChannel.cpp" | shasum -a 256 -c -
          echo "d8c69569b5cdfef2f7e9d85c9d919f7b5c3d76efa46131ca1a6033134ac8f010  src/engine/SSLChannel.h" | shasum -a 256 -c -
          echo "40aca5982e2a87c773d2c9b8cd4bc7727dacaa39e6d3abe0486117660f3238d6  src/engine/SSLMixBus.cpp" | shasum -a 256 -c -
          echo "185faadabba3a5599d0f267e4a288608016436eb07f9edb6ee031c872828b18c  src/engine/SSLMixBus.h" | shasum -a 256 -c -
      - name: Configure Intel macOS 10.13 target
        run: cmake -S src -B src/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Build
        run: cmake --build src/build --config Release --parallel 4
      - name: Engine tests
        run: ctest --test-dir src/build --output-on-failure
      - name: Verify binary
        run: |
          file src/build/C-AUDIO.app/Contents/MacOS/C-AUDIO
          lipo -info src/build/C-AUDIO.app/Contents/MacOS/C-AUDIO
          otool -L src/build/C-AUDIO.app/Contents/MacOS/C-AUDIO
          test "$(lipo -archs src/build/C-AUDIO.app/Contents/MacOS/C-AUDIO)" = "x86_64"
      - name: Package app and source
        run: |
          ditto -c -k --sequesterRsrc --keepParent src/build/C-AUDIO.app C-AUDIO-V1-iMac2011-ProjectWindow.app.zip
          ditto -c -k --sequesterRsrc --keepParent src C-AUDIO-V1-ProjectWindow-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: C-AUDIO-V1-iMac2011-ProjectWindow
          path: |
            C-AUDIO-V1-iMac2011-ProjectWindow.app.zip
            C-AUDIO-V1-ProjectWindow-source.zip
          if-no-files-found: error
