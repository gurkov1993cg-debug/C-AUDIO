      - name: Configure Intel macOS 10.13 target
        run: cmake -S src -B src/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Build
        run: cmake --build src/build --config Release --parallel 4
      - name: Engine tests
        run: ctest --test-dir src/build --output-on-failure
      - name: Verify binary
        run: |
          file src/build/C-AUDIO.app/Contents/MacOS/C-AUDIO
          lipo -info src/build/C-AUDIO.app/Contents/MacOS/C-AUDIO
          otool -L src/build/C-AUDIO.app/Contents/MacOS/C-AUDIO
      - name: Package app and source
        run: |
          ditto -c -k --sequesterRsrc --keepParent src/build/C-AUDIO.app C-AUDIO-V1-iMac2011-SSLChannelTest.app.zip
          ditto -c -k --sequesterRsrc --keepParent src C-AUDIO-V1-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: C-AUDIO-V1-iMac2011-SSLChannelTest
          path: |
            C-AUDIO-V1-iMac2011-SSLChannelTest.app.zip
            C-AUDIO-V1-source.zip
          if-no-files-found: error
